name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificação do index.html
        run: |
          if [ -f "index.html" ]; then
            echo "✓ index.html encontrado"
          else
            echo "✗ index.html não encontrado"
            exit 1
          fi

          if grep -q "<!DOCTYPE html>" index.html && \
             grep -q "<html" index.html && \
             grep -q "<title>" index.html; then
            echo "✓ Estrutura básica do HTML validada"
          else
            echo "✗ index.html não possui a estrutura mínima esperada"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validação de compilação
        run: |
          echo "✓ Aplicação validada com sucesso"
          echo "✓ Estrutura do projeto está correta"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar no GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4