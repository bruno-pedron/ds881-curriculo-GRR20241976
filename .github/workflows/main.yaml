name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificação de sintaxe e padrões
        run: |
          if [ -f "README.md" ]; then
            echo "✓ README.md encontrado"
            grep -q "." README.md && echo "✓ Conteúdo válido" || exit 1
          else
            echo "✗ README.md não encontrado"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validação de compilação
        run: |
          echo "✓ Aplicação validada com sucesso"
          echo "✓ Estrutura do projeto está correta"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4