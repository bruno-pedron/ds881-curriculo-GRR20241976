name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: ESLint - Validação de sintaxe JavaScript (Airbnb)
        run: |
          echo "🔍 Executando ESLint com padrão Airbnb..."
          npm run lint -- --max-warnings=0
      
      - name: Prettier - Verificação de formatação
        run: |
          echo "🎨 Verificando formatação com Prettier..."
          npx prettier --check "src/**/*.{js,css,html,json,md}" --log-level warn
      
      - name: Stylelint - Validação de CSS
        run: |
          echo "🎨 Validando CSS com Stylelint..."
          npx stylelint "src/**/*.css" --max-warnings=0
      
      - name: HTML Validator - Validação de HTML
        run: |
          echo "✓ Validando HTML..."
          npx html-validate index.html     

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Construir aplicação com Docker
        run: docker compose run --rm app npm run build

      # usado para salvar os arquivos gerados no build e disponibilizar para o job de deploy
      - name: Salvar artefato gerado
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      
      # usado para baixar os arquivos gerados no build
      - name: Baixar artefatos da build
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist
          
      # teste de deploy no PR
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
          
      - name: Publicar no GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4